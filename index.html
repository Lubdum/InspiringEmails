<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobby Sign Up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 350px;
        }
        .hidden {
            display: none;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        p {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Step 1: Sign Up -->
        <div id="step-signup">
            <h2>Sign Up</h2>
            <p>Enter your email to get started.</p>
            <form id="signup-form">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="you@example.com">
                <button type="submit">Continue</button>
            </form>
        </div>

        <!-- Step 2: Verification -->
        <div id="step-verify" class="hidden">
            <h2>Verify Email</h2>
            <p>We sent a 6-digit code to <span id="display-email" style="font-weight: bold; color: #333;"></span>.</p>
            <form id="verify-form">
                <label for="code">Verification Code</label>
                <input type="text" id="code" required placeholder="Enter 123456" maxlength="6">
                <button type="submit">Verify</button>
            </form>
        </div>

        <!-- Step 3: Top 5 Hobbies -->
        <div id="step-hobbies" class="hidden">
            <h2>Your Top Hobbies</h2>
            <p>Tell us what you love to do.</p>
            <form id="hobbies-form">
                <input type="text" required placeholder="Hobby 1">
                <input type="text" required placeholder="Hobby 2">
                <input type="text" required placeholder="Hobby 3">
                <input type="text" required placeholder="Hobby 4">
                <input type="text" required placeholder="Hobby 5">
                <button type="submit">Save Hobbies</button>
            </form>
        </div>

        <!-- Step 4: Success Message -->
        <div id="step-success" class="hidden">
            <h2>All Set!</h2>
            <p>Thank you for signing up and sharing your hobbies with us.</p>
        </div>
    </div>

    <script>
        const signupForm = document.getElementById('signup-form');
        const verifyForm = document.getElementById('verify-form');
        const hobbiesForm = document.getElementById('hobbies-form');

        const stepSignup = document.getElementById('step-signup');
        const stepVerify = document.getElementById('step-verify');
        const stepHobbies = document.getElementById('step-hobbies');
        const stepSuccess = document.getElementById('step-success');

        const displayEmail = document.getElementById('display-email');

        // Handle Email Sign Up
        signupForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const emailInput = document.getElementById('email').value;
            displayEmail.textContent = emailInput;
            
            stepSignup.classList.add('hidden');
            stepVerify.classList.remove('hidden');
        });

        // Handle Code Verification
        verifyForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const codeInput = document.getElementById('code').value;

            // Simple mock verification (accepts any 6-digit code for demonstration)
            if (codeInput.length === 6) {
                stepVerify.classList.add('hidden');
                stepHobbies.classList.remove('hidden');
            } else {
                alert('Please enter a valid 6-digit code.');
            }
        });

        // Handle Hobbies Submission
        hobbiesForm.addEventListener('submit', function(e) {
            e.preventDefault();
            stepHobbies.classList.add('hidden');
            stepSuccess.classList.remove('hidden');
        });
    </script>

</body>
</html>
