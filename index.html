<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Terminal</title>
    <style>
        body {
            background-color: #0c0c0c;
            color: #cccccc;
            font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
            margin: 0;
            padding: 12px;
            font-size: 14px;
            overflow: hidden;
        }

        .terminal {
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            position: relative;
            z-index: 1; /* Main terminal is now in the background layer */
        }

        .output-area {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 5px;
            line-height: 1.4;
        }

        .fake-terminal {
            position: absolute;
            background-color: #0c0c0c;
            border: 1px solid #444;
            color: #cccccc;
            font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            padding: 10px;
            width: 320px;
            height: 180px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 999; /* Fake popups are forced to the absolute top layer */
            overflow: hidden;
            opacity: 1;
        }

        .fake-terminal-header {
            background: #1f1f1f;
            padding: 2px 5px;
            margin: -10px -10px 8px -10px;
            font-size: 11px;
            color: #888;
            border-bottom: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="terminal" id="main-terminal">
        <div class="output-area" id="output">Windows PowerShell
Copyright (C) Microsoft Corporation. All rights reserved.

PS C:\Users\User> python game_loader.py
</div>
    </div>

    <script>
        const outputArea = document.getElementById('output');

        function appendLine(text) {
            outputArea.textContent += text + "\n";
            outputArea.scrollTop = outputArea.scrollHeight;
        }

        function updateLastLine(text) {
            let lines = outputArea.textContent.split('\n');
            lines[lines.length - 2] = text;
            outputArea.textContent = lines.join('\n');
            outputArea.scrollTop = outputArea.scrollHeight;
        }

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        function playLoudErrorSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc1.type = 'sawtooth';
                osc2.type = 'square';

                osc1.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc2.frequency.setValueAtTime(311.13, audioCtx.currentTime);

                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

                osc1.connect(gainNode);
                osc2.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc1.start();
                osc2.start();
                osc1.stop(audioCtx.currentTime + 0.15);
                osc2.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                // Failsafe
            }
        }

        window.addEventListener('click', () => {
            const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (tempCtx.state === 'suspended') {
                tempCtx.resume();
            }
        }, { once: true });

        async function spawnFakeTerminals() {
            const codeSnippets = [
                "Allocating memory: 0x004F2A...",
                "Injecting payload into roblox.exe...",
                "Bypassing system integrity check...",
                "Error 404: DirectX texture missing",
                "Loading kernel modules...",
                "Connection established to server [US-East]...",
                "Warning: High CPU usage detected",
                "Spawning asset bundles..."
            ];

            for (let i = 0; i < 100; i++) {
                const fakeBox = document.createElement('div');
                fakeBox.className = 'fake-terminal';
                
                const randomX = Math.random() * (window.innerWidth - 350);
                const randomY = Math.random() * (window.innerHeight - 200);
                fakeBox.style.left = `${randomX}px`;
                fakeBox.style.top = `${randomY}px`;

                const randomText = codeSnippets[Math.floor(Math.random() * codeSnippets.length)];
                fakeBox.innerHTML = `
                    <div class="fake-terminal-header">cmd.exe - process_${Math.floor(Math.random()*9000+1000)}</div>
                    <div>Microsoft Windows [Version 10.0.19045]</div>
                    <br>
                    <div>C:\\Windows\\System32> ${randomText}</div>
                `;

                document.body.appendChild(fakeBox);
                playLoudErrorSound();

                await sleep(15);
            }

            await sleep(300);
            try {
                window.close();
            } catch (e) {}
            
            appendLine("\n[FATAL CRASH: System memory exhausted. Please close this tab.]");
        }

        async function runSequence() {
            const stepCounter = async (max, prefix) => {
                appendLine("");
                for (let i = 1; i <= max; i += Math.max(1, Math.floor(max / 30))) {
                    updateLastLine(`${i}/${max} ${prefix}`);
                    await sleep(30);
                }
                updateLastLine(`${max}/${max} ${prefix}`);
            };

            await sleep(300);
            appendLine("[[Files loading]]");

            await sleep(300);
            appendLine("[downloading Cache's]");

            await sleep(300);
            await stepCounter(245, "files");

            await sleep(300);
            appendLine("[game downloading]");

            await sleep(300);
            appendLine("[Downloading game]");

            await sleep(300);
            await stepCounter(128, "chunks");

            await sleep(300);
            appendLine("[Successfully downloaded roblox.exe]");
            
            spawnFakeTerminals();
        }

        runSequence();
    </script>
</body>
</html>
